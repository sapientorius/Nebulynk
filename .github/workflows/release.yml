name: Publish stable release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag commit to be on stable
        run: |
          git fetch origin stable
          git merge-base --is-ancestor "$GITHUB_SHA" origin/stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and tag
        run: npm run release:validate

      - name: Run release CI
        run: npm run ci

  sign-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the active signing key to be embedded in the release
        env:
          UPDATE_FEED_SIGNING_KEY_ID: ${{ vars.UPDATE_FEED_SIGNING_KEY_ID }}
          UPDATE_FEED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_FEED_PUBLIC_KEYS_JSON }}
        run: npm run release:validate-keyring

      - name: Build signed update feed
        env:
          UPDATE_FEED_SIGNING_KEY_ID: ${{ vars.UPDATE_FEED_SIGNING_KEY_ID }}
          UPDATE_FEED_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_SIGNING_PRIVATE_KEY }}
        run: npm run release:build-feed

      - name: Verify published bytes against trusted public keys
        env:
          UPDATE_FEED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_FEED_PUBLIC_KEYS_JSON }}
        run: npm run release:verify-feed

      - name: Prevent publication rollback
        env:
          UPDATE_FEED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_FEED_PUBLIC_KEYS_JSON }}
        run: npm run release:assert-feed-advance

      - name: Render English release notes and changelog
        run: npm run release:notes

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            # Published immutable releases and their assets must never be changed.
            # A rerun may still safely rebuild and publish the signed Pages feed.
            echo "GitHub release ${{ github.ref_name }} already exists; leaving immutable release unchanged."
          else
            gh release create "${{ github.ref_name }}" --verify-tag --title "Nebulynk ${{ github.ref_name }}" --notes-file dist-release-notes/release-notes.md dist-release-notes/CHANGELOG.md
          fi

      - name: Upload signed GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-update-feed

  deploy-feed:
    needs: sign-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
