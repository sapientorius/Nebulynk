name: Publish stable release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag commit to be on stable
        run: |
          git fetch origin stable
          git merge-base --is-ancestor "$GITHUB_SHA" origin/stable

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  container-candidates:
    needs: [validate, checks]
    uses: ./.github/workflows/container-candidates.yml
    permissions:
      contents: read
      packages: write

  publish-images:
    needs: container-candidates
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: container-candidate-*
          path: output/container-candidates
      - name: Promote verified digests and require anonymous registry access
        run: node scripts/container-release.mjs promote
      - uses: actions/upload-artifact@v4
        with:
          name: container-release-manifest
          path: dist/containers/container-images.json
          if-no-files-found: error

  sign-and-publish:
    needs: [validate, checks, publish-images]
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified image references
        uses: actions/download-artifact@v4
        with:
          name: container-release-manifest
          path: dist/containers

      - name: Build and validate Plesk extension package
        env:
          NEBULYNK_CONTAINER_MANIFEST: dist/containers/container-images.json
        run: npm run plesk:package && npm run plesk:package:check

      - name: Require the active signing key to be embedded in the release
        env:
          UPDATE_FEED_SIGNING_KEY_ID: ${{ vars.UPDATE_FEED_SIGNING_KEY_ID }}
          UPDATE_FEED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_FEED_PUBLIC_KEYS_JSON }}
        run: npm run release:validate-keyring

      - name: Build signed update feed
        env:
          UPDATE_FEED_SIGNING_KEY_ID: ${{ vars.UPDATE_FEED_SIGNING_KEY_ID }}
          UPDATE_FEED_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_SIGNING_PRIVATE_KEY }}
        run: npm run release:build-feed

      - name: Verify published bytes against trusted public keys
        env:
          UPDATE_FEED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_FEED_PUBLIC_KEYS_JSON }}
        run: npm run release:verify-feed

      - name: Prevent publication rollback
        env:
          UPDATE_FEED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_FEED_PUBLIC_KEYS_JSON }}
        run: npm run release:assert-feed-advance

      - name: Render English release notes and changelog
        run: npm run release:notes

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          plesk_archives=(dist/plesk/nebulynk-plesk-*.zip)
          if [ "${#plesk_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Plesk extension archive, found ${#plesk_archives[@]}."
            exit 1
          fi

          plesk_archive="${plesk_archives[0]}"
          plesk_checksum="${plesk_archive}.sha256"
          if [ ! -f "$plesk_checksum" ]; then
            echo "Plesk extension checksum is missing: $plesk_checksum"
            exit 1
          fi

          if release_state="$(gh release view "${{ github.ref_name }}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$release_state" = "true" ]; then
              echo "GitHub release ${{ github.ref_name }} is an unpublished draft; resolve it before rerunning this release."
              exit 1
            fi

            # Published immutable releases and their assets must never be changed.
            # Missing or conflicting assets must block the signed feed on reruns.
            mkdir -p output/published-release
            gh release download "${{ github.ref_name }}" --dir output/published-release \
              --pattern container-images.json --pattern "$(basename "$plesk_archive")" \
              --pattern "$(basename "$plesk_checksum")"
            node scripts/verify-release-container-assets.mjs output/published-release "$plesk_archive"
            echo "GitHub release ${{ github.ref_name }} already exists; leaving immutable release unchanged."
          else
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --title "Nebulynk ${{ github.ref_name }}" \
              --notes-file dist-release-notes/release-notes.md \
              dist-release-notes/CHANGELOG.md \
              dist/containers/container-images.json \
              "$plesk_archive" \
              "$plesk_checksum"
          fi

      - name: Upload signed GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-update-feed

  deploy-feed:
    needs: sign-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
