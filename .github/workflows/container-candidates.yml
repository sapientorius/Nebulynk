name: Build and verify container candidates

on:
  workflow_call:
    inputs:
      channel:
        description: Publication channel (stable or staging)
        type: string
        default: stable

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.channel == 'staging' && 'container-staging' || 'release-production' }}
    env:
      NEBULYNK_CONTAINER_CHANNEL: ${{ inputs.channel }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or reuse immutable candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/container-release.mjs build ${{ matrix.arch }}
      - run: npm exec --workspace=frontend playwright install --with-deps chromium
      - name: Test the published candidate digests on the native architecture
        run: npm run test:containers
      - name: Verify transcription worker isolation
        run: npm run test:transcription:isolation
      - name: Scan the tested images and mark candidate results verified
        run: node scripts/container-release.mjs scan ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-candidate-${{ matrix.arch }}
          path: |
            output/container-candidates/*.json
            output/ci/
          if-no-files-found: error
