name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      profile:
        description: CI profile (quick or full); publication callers must use full
        type: string
        default: full
      local-container-tests:
        description: Build local test images; disable only when native candidate verification follows
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      profile:
        description: CI scope
        type: choice
        options: [full, quick]
        default: full

# Called publication workflows use a unique group and retain their own queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.profile == '' && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ inputs.profile == '' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

permissions:
  contents: read

jobs:
  scope:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      core: ${{ steps.plan.outputs.core }}
      full: ${{ steps.plan.outputs.full }}
      containers: ${{ steps.plan.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CI selection and required-status policy
        run: node --test scripts/ci-policy.test.mjs
      - name: Select checks for this event and changed paths
        id: plan
        env:
          CI_PROFILE: ${{ inputs.profile }}
          CI_LOCAL_CONTAINERS: ${{ inputs.local-container-tests }}
        run: node scripts/ci-policy.mjs plan

  validate:
    name: Core
    needs: scope
    if: ${{ needs.scope.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run quick checks and dependency audit
        if: ${{ needs.scope.outputs.profile == 'quick' }}
        run: npm run ci:quick
      - name: Run core checks and production build
        if: ${{ needs.scope.outputs.full == 'true' }}
        run: npm run ci:core

  postgres-integration:
    name: PostgreSQL integration
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-diagnostics
          path: output/ci/
          if-no-files-found: ignore

  plesk:
    name: Plesk and Garage
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:plesk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plesk-diagnostics
          path: output/ci/
          if-no-files-found: ignore

  security:
    name: Security
    needs: scope
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-diagnostics
          path: |
            output/ci/**/commands.log
            output/ci/**/gitleaks-*.json
            output/ci/**/trivy.json
          if-no-files-found: ignore

  e2e:
    name: Browser E2E
    needs: [scope, validate]
    if: ${{ needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=frontend playwright install --with-deps chromium
      - run: npm run ci:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            output/ci/
          if-no-files-found: ignore

  containers:
    name: Containers (${{ matrix.arch }})
    needs: scope
    if: ${{ needs.scope.outputs.containers == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=frontend playwright install --with-deps chromium
      - run: npm run test:deployments
      - run: npm run test:containers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-diagnostics-${{ matrix.arch }}
          path: output/ci/
          if-no-files-found: ignore

  required:
    name: CI required
    if: always()
    needs: [scope, validate, postgres-integration, plesk, security, e2e, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every group selected by this profile to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-policy.mjs verify
