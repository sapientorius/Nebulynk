name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:core

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-diagnostics
          path: output/ci/
          if-no-files-found: ignore

  plesk:
    name: Plesk and Garage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:plesk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plesk-diagnostics
          path: output/ci/
          if-no-files-found: ignore

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-diagnostics
          path: |
            output/ci/**/commands.log
            output/ci/**/gitleaks-*.json
            output/ci/**/trivy.json
          if-no-files-found: ignore

  e2e:
    name: Browser E2E
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=frontend playwright install --with-deps chromium
      - run: npm run ci:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            output/ci/
          if-no-files-found: ignore

  required:
    name: CI required
    if: always()
    needs: [validate, postgres-integration, plesk, security, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory group to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(results)) { console.log(name + ": " + job.result); if (job.result !== "success") process.exitCode = 1; }'
