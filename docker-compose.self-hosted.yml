# Combine with docker-compose.yml for a complete self-hosted Nebulynk stack:
# docker compose -f docker-compose.yml -f docker-compose.self-hosted.yml --env-file .env.production up -d --no-build
#
# The primary reverse proxy is expected to run on the host and reaches the
# frontend, backend, Garage, and LiveKit signalling ports through loopback.
# LiveKit TCP 7881 and UDP 7882 remain directly reachable for WebRTC media.
services:
  backend:
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.BACKEND_PORT||3030)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    image: ghcr.io/sapientorius/nebulynk-backend:${NEBULYNK_VERSION:-0.7.1}
    restart: unless-stopped
    env_file:
      - ${NEBULYNK_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      AUTH_CSRF_COOKIE_NAME: "${AUTH_CSRF_COOKIE_NAME-${VITE_AUTH_CSRF_COOKIE_NAME:-nebulynk_csrf_token}}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_S3_ENDPOINT: http://garage:3900
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_WS_URL: ws://livekit:7880
      MEETING_RECORDINGS_S3_ENDPOINT: http://garage:3900
      MEETING_RECORDINGS_EGRESS_S3_ENDPOINT: http://garage:3900
    depends_on:
      - postgres
      - redis
      - garage
      - livekit
      - livekit-egress
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3030}:3030"

  transcription-worker:
    image: ghcr.io/sapientorius/nebulynk-transcription-worker:${NEBULYNK_VERSION:-0.7.1}
    stop_grace_period: 75s
    mem_limit: ${TRANSCRIPTION_WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${TRANSCRIPTION_WORKER_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "node", "src/transcription-worker-health.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    env_file:
      - ${NEBULYNK_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      STORAGE_S3_ENDPOINT: http://garage:3900
      MEETING_RECORDINGS_S3_ENDPOINT: http://garage:3900
      TRANSCRIPTION_MAX_TEMP_BYTES: ${TRANSCRIPTION_MAX_TEMP_BYTES:-2147483648}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ghcr.io/sapientorius/nebulynk-frontend:${NEBULYNK_VERSION:-0.7.1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    environment:
      # Validate the required API URL at frontend startup, not in a nested fallback.
      API_URL: "${API_URL-${VITE_API_URL:-}}"
      BACKEND_URL: "${BACKEND_URL-${VITE_BACKEND_URL:-}}"
      LIVEKIT_URL: "${LIVEKIT_URL-${VITE_LIVEKIT_URL:-${LIVEKIT_PUBLIC_URL:-}}}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY-${VITE_VAPID_PUBLIC_KEY:-}}"
      AUTH_CSRF_COOKIE_NAME: "${AUTH_CSRF_COOKIE_NAME-${VITE_AUTH_CSRF_COOKIE_NAME:-nebulynk_csrf_token}}"
