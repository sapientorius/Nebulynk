server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' ws://127.0.0.1:47641; font-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), fullscreen=(self)" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Required for Vue Router history mode.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively, including self-hosted MediaPipe assets.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|wasm|tflite)$ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
  }
}
